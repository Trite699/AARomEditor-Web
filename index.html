<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ace Attorney NDS / Pack Editor</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f5f5f4;--bg3:#eeede9;--text:#1a1a18;--text2:#6b6b67;--border:rgba(0,0,0,.12);--border2:rgba(0,0,0,.22);--info-bg:#e6f1fb;--info-text:#185fa5;--info-border:rgba(24,95,165,.3);--ok:#0f6e56;--warn:#854f0b;--r:8px;--rl:12px;--mono:ui-monospace,'Cascadia Code','Fira Mono',monospace;--sans:system-ui,-apple-system,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--bg2:#242422;--bg3:#2c2c2a;--text:#f0efe8;--text2:#9b9b96;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.18);--info-bg:#0c3055;--info-text:#85b7eb;--info-border:rgba(133,183,235,.3);--ok:#5dcaa5;--warn:#fac775;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1c1a;--bg2:#242422;--bg3:#2c2c2a;--text:#f0efe8;--text2:#9b9b96;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.18);--info-bg:#0c3055;--info-text:#85b7eb;--info-border:rgba(133,183,235,.3);--ok:#5dcaa5;--warn:#fac775;color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--sans);background:var(--bg3);color:var(--text);min-height:100vh;padding:1.5rem}
h1{font-size:20px;font-weight:500}
.app{max-width:1100px;margin:0 auto}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap}
.toolbar h1{flex:1;min-width:200px}
.btn,select{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--r);border:.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:13px;font-family:var(--sans);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg2)}.btn:disabled{opacity:.4}
.btn.primary{background:var(--info-bg);color:var(--info-text);border-color:var(--info-border)}
.btn.success{color:var(--ok);border-color:var(--ok)}
.chk{font-size:12px;color:var(--text2);display:flex;gap:4px;align-items:center}
.drop-zone{border:1.5px dashed var(--border2);border-radius:var(--rl);padding:3rem 2rem;text-align:center;cursor:pointer;background:var(--bg);margin-bottom:1.25rem}
.drop-zone:hover,.drop-zone.drag{background:var(--bg2);border-color:var(--info-border)}
.drop-zone .icon{font-size:36px;margin-bottom:.5rem}.drop-zone p{color:var(--text2);font-size:13px;margin-top:.3rem}
.info-bar{display:flex;gap:1.25rem;flex-wrap:wrap;background:var(--bg);border:.5px solid var(--border);border-radius:var(--r);padding:.6rem 1rem;font-size:13px;color:var(--text2);margin-bottom:1.25rem}
.info-bar b{color:var(--text);font-weight:500}
.pane{display:grid;grid-template-columns:280px 1fr;gap:1rem;align-items:start}
@media (max-width:680px){.pane{grid-template-columns:1fr}}
.tree-panel,.detail-panel{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);overflow-y:auto;max-height:70vh}
.hd{padding:.55rem .9rem;font-size:12px;font-weight:500;color:var(--text2);border-bottom:.5px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:1}
.tree-item{display:flex;align-items:center;gap:7px;padding:.36rem .9rem;font-size:13px;cursor:pointer;border-bottom:.5px solid var(--border);user-select:none}
.tree-item:hover{background:var(--bg2)}.tree-item.selected{background:var(--info-bg);color:var(--info-text)}
.tree-item.folder{font-weight:500}.indent{display:inline-block;flex-shrink:0}
.tree-count{font-size:11px;color:var(--text2)}
.nm{flex:1;font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body{padding:1rem}
.file-row{display:flex;align-items:center;gap:8px;padding:.5rem .75rem;border-radius:var(--r);border:.5px solid var(--border);background:var(--bg2);margin-bottom:5px;flex-wrap:wrap}
.fname{flex:1;font-size:13px;font-family:var(--mono);word-break:break-all;min-width:120px}
.fsize{font-size:12px;color:var(--text2);white-space:nowrap}
.fext{font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--r);flex-shrink:0}
.ab{font-size:12px;padding:4px 10px;border-radius:var(--r);border:.5px solid var(--border2);background:transparent;color:var(--text);cursor:pointer}
.ab:hover{background:var(--bg3)}.ab.rp{color:var(--ok);border-color:var(--ok)}
.sw{display:flex;gap:8px;margin-bottom:.75rem;flex-wrap:wrap}
.sw input{flex:1;min-width:140px;padding:.35rem .7rem;border-radius:var(--r);border:.5px solid var(--border2);background:var(--bg2);color:var(--text);font-size:13px}
.dt{width:100%;border-collapse:collapse;font-size:13px}.dt td{padding:5px 0;vertical-align:top}.dt td:first-child{color:var(--text2);width:110px}
.dt code{font-family:var(--mono);font-size:12px;word-break:break-all}
.empty{display:flex;flex-direction:column;align-items:center;padding:3rem 1rem;color:var(--text2);font-size:14px;gap:.5rem;text-align:center}
.mod{font-size:12px;color:var(--warn)}
.note{font-size:12px;color:var(--text2);margin-top:.5rem}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <h1>⚖️ Ace Attorney NDS / Pack Editor</h1>
    <label class="chk" id="rawl" style="display:none"><input type="checkbox" id="raw"> replacement is already compressed</label>
    <select id="ver" style="display:none"><option value="aj">Apollo Justice names</option><option value="tri">AA Trilogy names</option><option value="none">No names</option></select>
    <span id="mod" class="mod" style="display:none"></span>
    <button class="btn" id="clr" style="display:none">✕ Clear</button>
    <button class="btn primary" id="save" style="display:none">⬇ Download</button>
  </div>
  <div id="dz" class="drop-zone">
    <div class="icon">📦</div>
    <b style="font-size:15px">Drop an Ace Attorney .nds ROM here</b>
    <p>or click to browse &mdash; or select <b>pack.inc + pack.dat</b> together (3DS Apollo Justice / AA Trilogy)</p>
    <p style="font-size:12px">NDS: GK1 / GK2 archives (Capcom plugin formats) · LZ10 / LZ11 / RLE</p>
  </div>
  <input type="file" id="fi" multiple accept=".nds,.srl,.inc,.dat" style="display:none">
  <input type="file" id="rep" style="display:none">
  <div id="info" class="info-bar" style="display:none"></div>
  <div id="pane" class="pane" style="display:none">
    <div class="tree-panel"><div class="hd">Folders &amp; Files</div><div id="tree"></div></div>
    <div class="detail-panel"><div class="hd" id="dh">Select a folder or file</div><div class="body" id="db"></div></div>
  </div>
</div>

// ───────── loading ─────────
async function loadFiles(list){
  const fs=[...list];
  try{
    const nds=fs.find(f=>/\.(nds|srl)$/i.test(f.name));
    if(nds)return loadRom(new Uint8Array(await nds.arrayBuffer()),nds.name);
    const inc=fs.find(f=>/\.inc$/i.test(f.name)),dat=fs.find(f=>/\.dat$/i.test(f.name));
    if(!inc||!dat)throw new Error('Select a .nds ROM, or both pack.inc and pack.dat together.');
    await loadPack(new Uint8Array(await inc.arrayBuffer()),new Uint8Array(await dat.arrayBuffer()));
  }catch(e){alert('Failed to load:\n'+e.message)}
}
function loadRom(b,name){
  if(b.length<0x200)throw new Error('File too small to be an NDS ROM.');
  const fnt=rd32(b,0x40),fat=rd32(b,0x48),fatN=rd32(b,0x4C)/8;
  if(!fnt||!fat||fnt>=b.length||fat+fatN*8>b.length)throw new Error('Invalid NDS header (FNT/FAT out of range).');
  const items=[],seen=new Set();
  const walk=(dir,pre)=>{
    if(seen.has(dir))return;seen.add(dir);
    const e=fnt+(dir&0xFFF)*8;let p=fnt+rd32(b,e),id=rd16(b,e+4);
    for(;;){
      const c=b[p++];if(!c)break;
      const len=c&0x7F,nm=txt(b.subarray(p,p+len));p+=len;
      if(c&0x80){const sub=rd16(b,p);p+=2;walk(sub,pre+nm+'/')}

    }
  };
  walk(0xF000,'');
  if(!items.length)throw new Error('No files found in the NDS filesystem.');
  S={mode:'rom',name,bytes:b,items};
  const unit=b[0x12];
  $('info').innerHTML=`<span><b>${esc(name)}</b></span><span>Title: <b>${esc(txt(b.subarray(0,12)).replace(/\0/g,''))}</b></span><span>Code: <b>${esc(txt(b.subarray(0xC,0x10)))}</b></span><span>Size: <b>${fmtSize(b.length)}</b></span><span>Files: <b>${items.length}</b></span>`+(unit?'<span class="mod">DSi-enhanced ROM: DSi signatures are not updated</span>':'');
  start();
}
async function loadPack(inc,dat){
  MAPS=await mapsReady;

    if(off+cs>dat.length)throw new Error('pack.inc does not match pack.dat (entry '+i+' out of range).');
    const raw=dat.subarray(off,off+cs);

}

function openArchive(n,fmt){
  let d;try{d=plain(n)}catch(e){return alert(e.message)}
  const f=fmt==='auto'?detect(d):fmt;
  if(!f)return alert('Could not detect an archive format. Pick one manually.');
  try{
    if(!(n.arc&&n.arc.fmt===f))n.arc=parseArc(d,f);

function buildZip(entries){
  const enc=new TextEncoder(),chunks=[],central=[];let off=0,cd=0;
  for(const e of entries){
    const nb=enc.encode(e.name),len=e.data.length,crc=crc32(e.data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,len,true);lh.setUint32(22,len,true);lh.setUint16(26,nb.length,true);
    chunks.push(lh.buffer,nb,e.data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,len,true);c.setUint32(24,len,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
    central.push(c.buffer,nb);cd+=46+nb.length;off+=30+nb.length+len;
  }
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);end.setUint32(12,cd,true);end.setUint32(16,off,true);
  return new Blob([...chunks,...central,end.buffer],{type:'application/zip'});
}
function zipDir(){
  const l=dirList(sel.k),strip=sel.k?sel.k.length+1:0,ents=[];
  for(const n of l){let d;try{d=plain(n)}catch(e){d=cur(n).raw}ents.push({name:n.path.slice(strip),data:d})}
  download(buildZip(ents),(S.name.replace(/\.[^.]+$/,'')+'_'+(sel.k.split('/').pop()||'all'))+'.zip');

function romData(n){
  if(n.arc&&n.arc.entries.some(e=>e.rep))return buildArc(n.arc);
  return n.rep?n.rep.raw:null;
}
function saveRom(){
  const b=S.bytes,fat=rd32(b,0x48);let pos=align(b.length,0x200);const plan=[];
  for(const n of S.items){
    const d=romData(n);if(!d)continue;
    if(d.length<=n.end-n.start)plan.push([n,d,n.start]);
    else{plan.push([n,d,pos]);pos=align(pos+d.length,0x200)}
  }
  const total=Math.max(b.length,pos===align(b.length,0x200)?b.length:pos);
  const out=new Uint8Array(total);out.set(b);out.fill(0xFF,b.length);
  for(const [n,d,s] of plan){out.set(d,s);wr32(out,fat+n.id*8,s);wr32(out,fat+n.id*8+4,s+d.length)}
  if(total>b.length){wr32(out,0x80,total);let c=out[0x14];while(0x20000*2**c<total)c++;out[0x14]=c}
  const c=crc16(out,0,0x15E);out[0x15E]=c&255;out[0x15F]=c>>8;
  download(new Blob([out]),S.name.replace(/\.(nds|srl)$/i,'')+'_patched.nds');
}
function savePack(){
  let pos=0;const parts=[],inc=new Uint8Array(S.items.length*0x14);
  S.items.forEach((n,i)=>{
    const c=cur(n),pad=(4-pos%4)%4;if(pad){parts.push(new Uint8Array(pad));pos+=pad}
    const o=i*0x14;wr32(inc,o,pos);wr32(inc,o+4,n.flags);wr32(inc,o+8,c.usize);wr32(inc,o+12,c.raw.length);wr32(inc,o+16,n.hash);
    parts.push(c.raw);pos+=c.raw.length;

  download(new Blob([inc]),'pack.inc');setTimeout(()=>download(new Blob(parts),'pack.dat'),500);
}

});
$('rep').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f||!pend)return;
  const b=new Uint8Array(await f.arrayBuffer());
  try{setData(pend,b,f.name,$('raw').checked);render()}catch(err){alert(err.message)}
};
$('ver').onchange=()=>{applyNames();render()};
$('save').onclick=()=>S.mode==='rom'?saveRom():savePack();
$('clr').onclick=clearAll;
$('fi').onchange=e=>loadFiles(e.target.files);
$('dz').onclick=()=>$('fi').click();
$('dz').ondragover=e=>{e.preventDefault();$('dz').classList.add('drag')};
$('dz').ondragleave=()=>$('dz').classList.remove('drag');
$('dz').ondrop=e=>{e.preventDefault();$('dz').classList.remove('drag');loadFiles(e.dataTransfer.files)};
</script>
</body>
</html>
